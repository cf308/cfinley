<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C Finley — Private Access</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <main class="portal-main">
      <form class="portal-card" id="portal-form" autocomplete="off">
        <div class="portal-wordmark">C&nbsp;FINLEY</div>
        <p class="portal-title">Private Access</p>

        <div class="field">
          <label for="user-id">Email / User ID</label>
          <input type="text" id="user-id" name="user-id" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="off">
        </div>

        <button type="submit" class="portal-btn">Continue</button>

        <p class="portal-message" id="portal-message" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer class="footer">
      <a href="index.html">&larr; Return home</a>
    </footer>
  </div>

  <script>
    // Decorative only. Nothing entered here is transmitted, stored, or
    // validated in any way — this form has no backend.
    const messages = [
      "External access unavailable.",
      "This resource is not available from this network."
    ];

    document.getElementById('portal-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const el = document.getElementById('portal-message');
      const msg = messages[Math.floor(Math.random() * messages.length)];
      el.textContent = msg;
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C Finley — Private Access</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <main class="portal-main">
      <form class="portal-card" id="portal-form" autocomplete="off">
        <div class="portal-wordmark">C&nbsp;FINLEY</div>
        <p class="portal-title">Private Access</p>

        <div class="field">
          <label for="email">Email / User ID</label>
          <input type="text" id="email" name="email" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="off">
        </div>

        <button type="submit" class="portal-btn" id="portal-submit">Continue</button>

        <p class="portal-message" id="portal-message" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer class="footer">
      <a href="index.html">&larr; Return home</a>
      <span class="sep" id="setup-sep" hidden>&middot;</span>
      <a href="setup.html" id="setup-link" hidden>First-time setup</a>
    </footer>
  </div>

  <script>
    const form = document.getElementById('portal-form');
    const submitBtn = document.getElementById('portal-submit');
    const messageEl = document.getElementById('portal-message');

    fetch('/api/setup')
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (data && data.needsSetup) {
          document.getElementById('setup-link').hidden = false;
          document.getElementById('setup-sep').hidden = false;
        }
      })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.textContent = '';
      submitBtn.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          messageEl.textContent = data.error || 'This resource is not available from this network.';
          submitBtn.disabled = false;
          return;
        }

        window.location.href = data.isAdmin ? 'admin.html' : 'dashboard.html';
      } catch (err) {
        messageEl.textContent = 'External access unavailable.';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

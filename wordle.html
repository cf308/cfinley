<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C Finley — Wordle</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="status.js" defer></script>
</head>
<body>
  <div class="page">
    <main class="admin-main">
      <div class="admin-wrap wordle-wrap" id="content" hidden>
        <div class="admin-header">
          <div class="doc-wordmark">C&nbsp;FINLEY</div>
          <div class="admin-header-actions">
            <a href="dashboard.html">Home</a>
            <a href="#" id="logout-link">Log out</a>
          </div>
        </div>

        <h1 class="admin-title">Wordle</h1>

        <p class="portal-message" id="wordle-message" role="status" aria-live="polite"></p>

        <div class="wordle-board" id="wordle-board"></div>
        <div class="wordle-keyboard" id="wordle-keyboard"></div>
      </div>

      <p class="portal-message" id="loading">Checking session&hellip;</p>
    </main>
  </div>

  <script>
    const WORD_LENGTH = 5;
    const MAX_GUESSES = 6;
    const KEY_ROWS = [
      ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
      ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'],
      ['enter', 'z', 'x', 'c', 'v', 'b', 'n', 'm', 'backspace'],
    ];

    let targetWord = '';
    let today = '';
    let guesses = [];
    let currentGuess = '';
    let gameOver = false;
    let keyStates = {};

    function storageKey() {
      return 'wordle-' + today;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(storageKey());
        if (!raw) return;
        const state = JSON.parse(raw);
        guesses = state.guesses || [];
        gameOver = Boolean(state.gameOver);
      } catch {
        // ignore corrupt/inaccessible storage
      }
    }

    function saveState() {
      try {
        localStorage.setItem(storageKey(), JSON.stringify({ guesses, gameOver }));
      } catch {
        // ignore storage failures (private browsing, quota, etc.)
      }
    }

    function evaluateGuess(guess) {
      const result = new Array(WORD_LENGTH).fill('absent');
      const targetChars = targetWord.split('');
      const guessChars = guess.split('');
      const used = new Array(WORD_LENGTH).fill(false);

      for (let i = 0; i < WORD_LENGTH; i++) {
        if (guessChars[i] === targetChars[i]) {
          result[i] = 'correct';
          used[i] = true;
        }
      }
      for (let i = 0; i < WORD_LENGTH; i++) {
        if (result[i] === 'correct') continue;
        const idx = targetChars.findIndex((c, j) => c === guessChars[i] && !used[j]);
        if (idx !== -1) {
          result[i] = 'present';
          used[idx] = true;
        }
      }
      return result;
    }

    function updateKeyStates(guess, result) {
      const rank = { absent: 0, present: 1, correct: 2 };
      guess.split('').forEach((letter, i) => {
        const state = result[i];
        if (!keyStates[letter] || rank[state] > rank[keyStates[letter]]) {
          keyStates[letter] = state;
        }
      });
    }

    function renderBoard() {
      const board = document.getElementById('wordle-board');
      board.innerHTML = '';

      for (let row = 0; row < MAX_GUESSES; row++) {
        const rowEl = document.createElement('div');
        rowEl.className = 'wordle-row';

        const guess = guesses[row];
        const isCurrentRow = row === guesses.length && !gameOver;
        const letters = guess ? guess.split('') : isCurrentRow ? currentGuess.split('') : [];
        const result = guess ? evaluateGuess(guess) : null;

        for (let col = 0; col < WORD_LENGTH; col++) {
          const tile = document.createElement('div');
          tile.className = 'wordle-tile';
          if (letters[col]) {
            tile.textContent = letters[col];
            tile.classList.add('filled');
          }
          if (result) {
            tile.classList.add(result[col]);
          }
          rowEl.appendChild(tile);
        }
        board.appendChild(rowEl);
      }
    }

    function renderKeyboard() {
      const kb = document.getElementById('wordle-keyboard');
      kb.innerHTML = '';

      KEY_ROWS.forEach((row) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'wordle-key-row';
        row.forEach((key) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'wordle-key';
          if (key === 'enter' || key === 'backspace') btn.classList.add('wide');
          if (keyStates[key]) btn.classList.add(keyStates[key]);
          btn.textContent = key === 'backspace' ? '⌫' : key === 'enter' ? 'Enter' : key;
          btn.addEventListener('click', () => handleKey(key));
          rowEl.appendChild(btn);
        });
        kb.appendChild(rowEl);
      });
    }

    function setMessage(text) {
      document.getElementById('wordle-message').textContent = text;
    }

    function handleKey(key) {
      if (gameOver || guesses.length >= MAX_GUESSES) return;

      if (key === 'backspace') {
        currentGuess = currentGuess.slice(0, -1);
      } else if (key === 'enter') {
        if (currentGuess.length !== WORD_LENGTH) {
          setMessage('Not enough letters.');
          return;
        }
        const result = evaluateGuess(currentGuess);
        updateKeyStates(currentGuess, result);
        guesses.push(currentGuess);

        if (currentGuess === targetWord) {
          gameOver = true;
          setMessage(`Solved in ${guesses.length}/${MAX_GUESSES}.`);
        } else if (guesses.length >= MAX_GUESSES) {
          gameOver = true;
          setMessage(`Out of guesses. The word was ${targetWord.toUpperCase()}.`);
        } else {
          setMessage('');
        }

        currentGuess = '';
        saveState();
      } else if (/^[a-z]$/.test(key) && currentGuess.length < WORD_LENGTH) {
        currentGuess += key;
      }

      renderBoard();
      renderKeyboard();
    }

    document.addEventListener('keydown', (e) => {
      if (!targetWord) return;
      const key = e.key.toLowerCase();
      if (key === 'enter') handleKey('enter');
      else if (key === 'backspace') handleKey('backspace');
      else if (/^[a-z]$/.test(key)) handleKey(key);
    });

    document.getElementById('logout-link').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = 'index.html';
    });

    fetch('/api/me')
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((data) => {
        if (!data.isAdmin && !(data.permissions || []).includes('wordle')) {
          window.location.href = 'dashboard.html';
          return Promise.reject('no-access');
        }
        document.getElementById('loading').hidden = true;
        document.getElementById('content').hidden = false;
        return fetch('/api/wordle');
      })
      .then((r) => (r && r.ok ? r.json() : Promise.reject()))
      .then((data) => {
        if (!data) return;
        targetWord = data.word;
        today = data.date;

        if (targetWord.length !== WORD_LENGTH) {
          setMessage('Unexpected word length from provider — try again tomorrow.');
          return;
        }

        loadState();
        guesses.forEach((g) => updateKeyStates(g, evaluateGuess(g)));
        if (gameOver) {
          const lastGuess = guesses[guesses.length - 1];
          setMessage(
            lastGuess === targetWord
              ? `Solved in ${guesses.length}/${MAX_GUESSES}.`
              : `Out of guesses. The word was ${targetWord.toUpperCase()}.`
          );
        }
        renderBoard();
        renderKeyboard();
      })
      .catch((err) => {
        if (err === 'no-access') return;
        setMessage('Unable to load today’s word.');
      });
  </script>
  <script
    src="https://assistloop.ai/assistloop-widget.js"
    defer
    onload="window.AssistLoopWidget && window.AssistLoopWidget.init({ agentId: 'dff24e88-a711-47ff-97f6-31c7b0dbaa6d' })"
  ></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C Finley — Home</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="status.js" defer></script>
</head>
<body>
  <div class="page">
    <main class="admin-main">
      <div class="admin-wrap" id="content" hidden>
        <div class="admin-header">
          <div class="doc-wordmark">C&nbsp;FINLEY</div>
          <div class="admin-header-actions">
            <span id="user-email"></span>
            <a href="#" id="logout-link">Log out</a>
          </div>
        </div>

        <h1 class="admin-title">Applications</h1>

        <div class="app-icons" id="app-icons"></div>
        <p class="portal-message" id="no-apps" hidden>No applications have been assigned to your account yet.</p>
      </div>

      <p class="portal-message" id="loading">Checking session&hellip;</p>
    </main>
  </div>

  <script>
    const APPS = [
      { id: 'files', name: 'File Storage', desc: 'Shared document storage.', href: 'files.html' },
      { id: 'notepad', name: 'Notepad', desc: 'Private notes.', href: 'notepad.html' },
      { id: 'hotels', name: 'Hotel Search', desc: 'Search hotels by city.', href: 'hotels.html' },
      { id: 'wordle', name: 'Wordle', desc: 'Daily word puzzle.', href: 'wordle.html' },
      { id: 'lifesim', name: 'Life Sim', desc: 'AI-driven life simulator.', href: 'lifesim.html' },
      { id: 'news', name: 'News', desc: 'Top headlines.', href: 'news.html' },
      { id: 'drive', name: 'Drive', desc: 'Arcade traffic dodger.', href: 'drive.html' },
      { id: 'connect4', name: 'Connect Four', desc: 'Play a friend with a room code.', href: 'connect4.html' },
      { id: 'roulette', name: 'Roulette', desc: 'Play-money roulette table.', href: 'roulette.html' },
      { id: 'adsb', name: 'ADS-B Exchange', desc: 'Live aircraft tracking.', href: null, comingSoon: true },
    ];

    const ICONS = {
      files:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a1 1 0 0 1 1-1h4.5l2 2H20a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7z"/></svg>',
      notepad:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3" width="15" height="18" rx="1"/><line x1="7.5" y1="8" x2="16.5" y2="8"/><line x1="7.5" y1="12" x2="16.5" y2="12"/><line x1="7.5" y1="16" x2="13" y2="16"/></svg>',
      hotels:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 19v-6a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v1"/><path d="M11.5 14h8a2 2 0 0 1 2 2v3"/><circle cx="6.5" cy="9" r="1.4"/><line x1="2.5" y1="21" x2="2.5" y2="11"/><line x1="21.5" y1="21" x2="21.5" y2="17"/><line x1="2.5" y1="19" x2="21.5" y2="19"/></svg>',
      wordle:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="3" y="3" width="5" height="5"/><rect x="9.5" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/><rect x="16" y="9.5" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><rect x="9.5" y="16" width="5" height="5"/><rect x="16" y="16" width="5" height="5"/></svg>',
      lifesim:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>',
      news:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="1"/><rect x="6" y="7" width="5" height="5"/><line x1="13" y1="8" x2="18" y2="8"/><line x1="13" y1="11" x2="17" y2="11"/><line x1="6" y1="15" x2="18" y2="15"/><line x1="6" y1="18" x2="15" y2="18"/></svg>',
      drive:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="3"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="9.5" y1="4.5" x2="14.5" y2="4.5"/></svg>',
      connect4:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="4" cy="12" r="2.6"/><circle cx="9.3" cy="12" r="2.6"/><circle cx="14.7" cy="12" r="2.6"/><circle cx="20" cy="12" r="2.6"/></svg>',
      roulette:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><line x1="12" y1="3" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="3" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="21" y2="12"/></svg>',
      adsb:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-7-7 18-3-7-8-4z"/></svg>',
      admin:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1M18.4 18.4l-2.1-2.1M7.7 7.7 5.6 5.6"/></svg>',
    };

    fetch('/api/me')
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((data) => {
        document.getElementById('loading').hidden = true;
        document.getElementById('user-email').textContent = data.email;

        const grid = document.getElementById('app-icons');
        const allowed = APPS.filter((app) => data.isAdmin || (data.permissions || []).includes(app.id));

        if (data.isAdmin) {
          allowed.push({ id: 'admin', name: 'Admin Panel', desc: 'Manage users and permissions.', href: 'admin.html' });
        }

        if (allowed.length === 0) {
          document.getElementById('no-apps').hidden = false;
        }

        allowed.forEach((app) => {
          const icon = document.createElement(app.href ? 'a' : 'div');
          icon.className = 'app-icon' + (app.comingSoon ? ' app-icon-disabled' : '');
          if (app.href) icon.href = app.href;
          icon.title = app.desc;
          icon.innerHTML = `
            <span class="app-icon-glyph">${ICONS[app.id] || ''}</span>
            <span class="app-icon-label">${app.name}</span>
            ${app.comingSoon ? '<span class="app-icon-badge">Soon</span>' : ''}
          `;
          grid.appendChild(icon);
        });

        document.getElementById('content').hidden = false;
      })
      .catch(() => {
        window.location.href = 'portal.html';
      });

    document.getElementById('logout-link').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = 'index.html';
    });
  </script>
  <script
    src="https://assistloop.ai/assistloop-widget.js"
    defer
    onload="window.AssistLoopWidget && window.AssistLoopWidget.init({ agentId: 'dff24e88-a711-47ff-97f6-31c7b0dbaa6d' })"
  ></script>
</body>
</html>
